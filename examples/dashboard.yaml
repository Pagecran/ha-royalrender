# Adjust entity IDs to those generated by your Home Assistant installation.
type: vertical-stack
cards:
  - type: entities
    title: Royal Render
    entities:
      - binary_sensor.royal_render_jobs_need_attention
      - sensor.royal_render_problem_jobs
      - sensor.royal_render_rendering_jobs
      - sensor.royal_render_waiting_jobs
      - sensor.royal_render_rendering_machines
  - type: markdown
    title: Jobs à surveiller
    content: >-
      {% if states('sensor.royal_render_problem_jobs') in ['unavailable', 'unknown'] %}
      ⚪ Données Royal Render indisponibles
      {% else %}
      {% for job in state_attr('sensor.royal_render_problem_jobs', 'jobs') or [] %}
      {{ '🔴' if job.health == 'blocked' else '🟠' }} **{{ job.label }}** — {{ job.name }}

      {{ job.done }}/{{ job.total }} frames · {{ job.errors }} erreurs · {{ job.status }}

      {% else %}
      🟢 Aucun incident actif détecté
      {% endfor %}
      {% endif %}
